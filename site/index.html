  footer { padding:40px 0 60px; color:var(--muted); font-size:13px; text-align:center; }

      f_exp:"تكاليف عملك السنوية", f_exp_s:"برامج، ضرائب أو رسوم تحتفظ بها، تأمين، معدات.",
      f_hours:"ساعات العمل المدفوعة أسبوعيًا", f_hours_s:"الأعمال الإدارية والتسويق والتعلّم لا تُدفع.",
      f_weeks:"أسابيع العمل في السنة", f_weeks_s:"بعد خصم الإجازات والأيام المرضية.",
      r_label:"أقل سعر ساعة لك", r_unit:"في الساعة",
      s_day:"سعر اليوم (٦ ساعات مدفوعة)", s_month:"متوسط الإيراد الشهري", s_hrs:"ساعات مدفوعة في السنة", s_rev:"الإيراد المطلوب",
      u_hrs:"ساعة", u_wks:"أسبوع",
      badge:"نسخة عربية وإنجليزية معًا",
      k_kit:"حقيبة المستقل", h2_kit:"ظهر باحترافية من اليوم الأول",
      sub_kit:"أربعة قوالب جاهزة تغطي رحلة العميل كاملة، بالعربية والإنجليزية، لتوفّر وقتك للعمل بدل الأوراق.",
      li1:"<b>عرض سعر للعميل</b> مصمّم لكسب المشروع", li2:"<b>اتفاقية خدمات</b> تشمل النطاق والدفع والملكية وإنهاء العقد",
      li3:"<b>قائمة استقبال العميل</b> مع رسائل جاهزة للنسخ", li4:"<b>فاتورة ذكية</b> تحسب المجموع وتُطبع بصيغة PDF",
      price_small:"دفعة واحدة · تنزيل فوري",
      buy:"احصل على الحقيبة", buy_note:"استرجاع خلال ٣٠ يومًا · دفع آمن · السعر بالدولار",
      k_why:"لماذا تنجح", h2_why:"كل ما يتوقعه العميل",
      sub_why:"العميل يحكم عليك قبل أن يرى عملك. المستندات الواضحة تبني الثقة وتسرّع استلام أموالك.",
      f1h:"اكسب مشاريع أكثر", f1p:"عرض سعر واضح يوضّح المشكلة والنطاق والسعر.",
      f2h:"احمِ نفسك", f2p:"شروط الدفعة المقدمة والتعديلات وتغيّر النطاق مكتوبة لك مسبقًا.",
      f3h:"ابدأ بسلاسة", f3p:"خطوات استقبال متكررة تمنع الالتباس والتأخير.",
      f4h:"استلم أموالك في وقتها", f4p:"فاتورة أنيقة بشروط التأخير وحساب تلقائي للمجاميع.",
      k_how:"كيف تعمل", h2_how:"جاهز خلال دقائق",
      st1h:"اشترِ ونزّل", st1p:"تصلك الملفات فورًا على بريدك.",
      st2h:"املأ الأقواس", st2p:"استبدل [الحقول] ببياناتك.",
      st3h:"أرسلها لعميلك", st3p:"افتح الملفات بأي محرر ثم صدّرها بصيغة PDF.",
      k_faq:"الأسئلة الشائعة", h2_faq:"أسئلة",
      q1:"ما صيغة الملفات؟", a1:"ملفات Markdown تفتح في أي محرر نصوص أو Word أو Google Docs، وفاتورة بصيغة HTML تعمل بدون إنترنت في أي متصفح. كل قالب متوفر بالعربية والإنجليزية.",
      q2:"هل العقد استشارة قانونية؟", a2:"لا. هو قالب عام وليس مخصصًا لقانون دولة بعينها. القوانين تختلف من بلد لآخر، فاعرضه على محامٍ مختص قبل استخدامه في الأعمال الكبيرة.",
      q3:"هل يمكنني استرجاع المبلغ؟", a3:"نعم. إذا لم تفدك الحقيبة، تواصل مع البائع عبر الإيصال خلال ٣٠ يومًا.",
      q4:"هل تحفظ الحاسبة أرقامي؟", a4:"لا. تعمل بالكامل داخل متصفحك ولا يُرسل أو يُخزَّن أي شيء.",
      q5:"هل القوالب العربية تعمل بشكل صحيح؟", a5:"نعم. النسخ العربية مكتوبة من اليمين إلى اليسار، وتتغير الفاتورة تلقائيًا إلى هذا الاتجاه.",
      final_h:"اطلب ما تستحقه. وظهر بمستواك.", final_sub:"احصل على القوالب الأربعة بالعربية والإنجليزية بأقل من سعر ساعة عمل واحدة.",
      final_btn:"احصل على الحقيبة · ١٢ دولارًا",
      foot:"© {y} BAG. القوالب مقدّمة كما هي وليست استشارة قانونية أو ضريبية أو مالية."
    }
  };

  // USD -> currency approx. factors (planning only)
  var FX = { USD:1, QAR:3.64, SAR:3.75, AED:3.67, KWD:0.31, OMR:0.385, BHD:0.377 };
  var BASE = { income:{min:10000,max:250000,step:1000,val:60000}, expenses:{min:0,max:80000,step:500,val:12000} };
  var $ = function (id) { return document.getElementById(id); };
  var lang = 'en', cur = 'QAR';

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
  function nice(x) {
    var p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))) ), r = Math.max(x, 1) / p, best = 1, d = 1e9;
    [1, 2, 2.5, 5, 10].forEach(function (c) { var e = Math.abs(Math.log(r / c)); if (e < d) { d = e; best = c; } });
    return best * p;
  }
  function money(n) { return Math.round(n).toLocaleString('en-US') + ' ' + cur; }
  function v(id) { return parseFloat($(id).value) || 0; }

  function configureSliders(prevCur) {
    var f = FX[cur], ratio = prevCur ? FX[cur] / FX[prevCur] : 1;
    ['income', 'expenses'].forEach(function (k) {
      var el = $(k), b = BASE[k];
      var step = nice(b.step * f), min = k === 'expenses' ? 0 : nice(b.min * f), max = nice(b.max * f);
      var cv = prevCur ? v(k) * ratio : b.val * f;
      el.min = min; el.max = max; el.step = step;
      el.value = Math.min(max, Math.max(min, Math.round(cv / step) * step));
    });
  }

  function calc() {
    var t = T[lang], income = v('income'), exp = v('expenses'), hrs = v('hours'), wks = v('weeks');
    $('o-income').textContent = money(income); $('o-expenses').textContent = money(exp);
    $('o-hours').textContent = hrs + ' ' + t.u_hrs; $('o-weeks').textContent = wks + ' ' + t.u_wks;
    var total = hrs * wks, need = income + exp;
    if (total <= 0) { $('rate').textContent = '—'; return; }
    var rate = need / total, dec = (FX[cur] < 1 || rate < 100) ? 2 : 0;
    $('rate').textContent = rate.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' ' + cur;
    $('day').textContent = money(rate * 6); $('month').textContent = money(need / 12);
    $('hrs').textContent = total.toLocaleString('en-US'); $('rev').textContent = money(need);
  }

  function apply(l) {
    lang = l; var t = T[l];
    document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function (el) { var k = el.getAttribute('data-i18n'); if (t[k] !== undefined) el.innerHTML = t[k]; });
    ['buy', 'buy2'].forEach(function (id) {
      var a = $(id);
      if (a.getAttribute('href').indexOf('BUY_LINK_PLACEHOLDER') !== -1) {
        a.textContent = l === 'ar' ? 'قريبًا' : 'Coming soon';
        a.setAttribute('aria-disabled', 'true'); a.style.opacity = '.6'; a.style.pointerEvents = 'none';
      }
    });
    $('langBtn').textContent = t.lang;
    $('foot').textContent = t.foot.replace('{y}', new Date().getFullYear());
    store('lang', l); calc();
  }

  $('langBtn').addEventListener('click', function () { apply(lang === 'en' ? 'ar' : 'en'); });
  $('cur').addEventListener('change', function () { var p = cur; cur = $('cur').value; configureSliders(p); store('cur', cur); calc(); });
  ['income', 'expenses', 'hours', 'weeks'].forEach(function (id) { $(id).addEventListener('input', calc); });

  var saved = store('lang'), sc = store('cur');
  var startLang = saved || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
  if (sc && FX[sc]) cur = sc;
  $('cur').value = cur; configureSliders(); apply(startLang);

  var els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  } else { els.forEach(function (e) { e.classList.add('in'); }); }
})();
</script>
